version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/:/docker-entrypoint-initdb.d/
    networks:
      - finance-network

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finance_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OAUTH2_RESOURCESERVER_JWT_AUDIENCE: ${OAUTH2_AUDIENCE}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OATH2_ISSUER_URI}
    depends_on:
      - postgres
      - keycloak
    networks:
      - finance-network

  ui:
    build: ../personal-finance-ui
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - finance-network

volumes:
  postgres_data:

networks:
  finance-network:
    driver: bridge